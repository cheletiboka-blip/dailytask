<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Task Manager</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4F46E5">
    <link rel="icon" type="image/png" href="icon-192.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React + Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [tasks, setTasks] = useState(() => {
                const saved = localStorage.getItem('daily_tasks');
                return saved ? JSON.parse(saved) : [];
            });
            const [taskText, setTaskText] = useState('');

            useEffect(() => {
                localStorage.setItem('daily_tasks', JSON.stringify(tasks));
            }, [tasks]);

            const addTask = (e) => {
                e.preventDefault();
                if (!taskText.trim()) return;
                setTasks([...tasks, { id: Date.now(), text: taskText, completed: false }]);
                setTaskText('');
            };

            const toggleTask = (id) => {
                setTasks(tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
            };

            const deleteTask = (id) => {
                setTasks(tasks.filter(t => t.id !== id));
            };

            return (
                <div class="max-w-md mx-auto min-h-screen bg-white shadow-lg flex flex-col">
                    <header class="bg-indigo-600 text-white p-4 text-center text-xl font-bold shadow">
                        Daily Task Manager
                    </header>
                    <main class="p-4 flex-1">
                        <form onSubmit={addTask} class="flex gap-2 mb-4">
                            <input 
                                type="text" 
                                value={taskText} 
                                onChange={(e) => setTaskText(e.target.value)} 
                                placeholder="নতুন টাস্ক লিখুন..." 
                                class="flex-1 p-2 border border-gray-300 rounded focus:outline-none focus:border-indigo-500"
                            />
                            <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">
                                যোগ করুন
                            </button>
                        </form>
                        <ul class="space-y-2">
                            {tasks.map(task => (
                                <li key={task.id} class="flex items-center justify-between p-3 bg-gray-50 rounded border">
                                    <span 
                                        onClick={() => toggleTask(task.id)}
                                        class={`cursor-pointer flex-1 ${task.completed ? 'line-through text-gray-400' : ''}`}
                                    >
                                        {task.text}
                                    </span>
                                    <button 
                                        onClick={() => deleteTask(task.id)}
                                        class="text-red-500 hover:text-red-700 font-bold ml-2"
                                    >
                                        মুছুন
                                    </button>
                                </li>
                            ))}
                        </ul>
                    </main>
                </div>
            );
        }

        // রেন্ডার করার সঠিক পদ্ধতি
        ReactDOM.render(<App />, document.getElementById("root"));
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW Registered'))
                    .catch(err => console.log('SW Error', err));
            });
        }
    </script>
</body>
</html>
