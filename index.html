    messagingSenderId: "10031644603",
    appId: "1:10031644603:web:afaf01434c65147d988e9e"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  db.enablePersistence().catch(() => {});

  function getFamilyCode() {
    let code = localStorage.getItem("family_code");
    if (!code) {
      code = "fam_" + Math.random().toString(36).substring(2, 8);
      localStorage.setItem("family_code", code);
    }
    return code;
  }

  function setFamilyCode(code) {
    localStorage.setItem("family_code", code.trim());
    window.location.reload();
  }

  const getCollectionName = () => `data_${getFamilyCode()}`;

  const appStorage = {
    async get(key, shared) {
      if (!shared) {
        const v = localStorage.getItem(key);
        return v !== null ? { key, value: v, shared } : null;
      }
      const doc = await db.collection(getCollectionName()).doc(key).get();
      if (!doc.exists) return null;
      return { key, value: doc.data().value, shared };
    },
    async set(key, value, shared) {
      if (!shared) {
        localStorage.setItem(key, value);
        return { key, value, shared };
      }
      await db.collection(getCollectionName()).doc(key).set({ value, updatedAt: Date.now() });
      return { key, value, shared };
    },
    async delete(key, shared) {
      if (!shared) {
        localStorage.removeItem(key);
        return { key, deleted: true, shared };
      }
      await db.collection(getCollectionName()).doc(key).delete();
      return { key, deleted: true, shared };
    },
    async list(prefix, shared) {
      if (!shared) {
        const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
        return { keys, prefix, shared };
      }
      let q = db.collection(getCollectionName());
      if (prefix) {
        q = q
          .where(firebase.firestore.FieldPath.documentId(), ">=", prefix)
          .where(firebase.firestore.FieldPath.documentId(), "<", prefix + "\uf8ff");
      }
      const snap = await q.get();
      const keys = snap.docs.map((d) => d.id);
      return { keys, prefix, shared };
    }
  };

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>

function fieldApplies(field, member) {
  if (!field.appliesTo) return true;
  if (!member || !member.gender) return true;
  return field.appliesTo === member.gender;
}

const BN_DIGITS = "০১২৩৪৫৬৭৮৯";
const toBn = (n) => String(n).replace(/[0-9]/g, (d) => BN_DIGITS[d]);

];

function pad2(n) { return String(n).padStart(2, "0"); }
function dateKey(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function monthPrefix(year, month0) { return `${year}-${pad2(month0 + 1)}`; }
function daysInMonth(year, month0) { return new Date(year, month0 + 1, 0).getDate(); }

function dailyScore(entry, member, allFields) {
  if (!entry) return null;
  let sum = 0;
  let count = 0;
  for (const f of allFields) {
    if (!fieldApplies(f, member)) continue;
    count += 1;
    if (f.type === "bool") {
      sum += entry[f.key] ? 1 : 0;
    } else if (f.type === "count") {
      sum += Math.min(f.max, Number(entry[f.key]) || 0) / f.max;
    } else if (f.type === "number") {
      if (f.target) {
        sum += Math.min(f.target, Number(entry[f.key]) || 0) / f.target;
      } else {
        sum += Number(entry[f.key]) > 0 ? 1 : 0;
      }
    }
  }
  return count ? sum / count : null;
}

function scoreColor(score) {
  if (score === null || score === undefined) return "#E7EEE3";
  if (score >= 0.85) return "#0E4B43";
  if (score >= 0.6) return "#4C8C74";
  if (score >= 0.35) return "#C89B3C";
  if (score > 0) return "#C1666B";
  return "#E7EEE3";
}

function fieldPercent(field, monthEntries, totalDays, member) {
  if (!fieldApplies(field, member)) return null;
  let hit = 0;
  if (field.type === "count") {
    let sum = 0;
    for (let d = 1; d <= totalDays; d++) {
      const e = monthEntries[pad2(d)];
      sum += Math.min(field.max, Number(e?.[field.key]) || 0);
    }
    return Math.round((sum / (totalDays * field.max)) * 100);
  }
  if (field.type === "number" && field.target) {
    let sum = 0;
    for (let d = 1; d <= totalDays; d++) {
      const e = monthEntries[pad2(d)];
      sum += Math.min(field.target, Number(e?.[field.key]) || 0);
    }
    return Math.round((sum / (totalDays * field.target)) * 100);
  }
  for (let d = 1; d <= totalDays; d++) {
    const e = monthEntries[pad2(d)];
    if (!e) continue;
    if (field.type === "bool" && e[field.key]) hit += 1;
    if (field.type === "number" && !field.target && Number(e[field.key]) > 0) hit += 1;
  }
  return Math.round((hit / totalDays) * 100);
}

function calculateStreak(monthEntries, member, allFields) {
  let streak = 0;
  const today = new Date();
  const d = new Date(today);

  for (let i = 0; i < 365; i++) {
    const dayStr = pad2(d.getDate());
    const entry = monthEntries[dayStr];
    
    if (entry && dailyScore(entry, member, allFields) >= 0.5) {
      streak++;
    } else if (i > 0) {
      break; 
    }
    d.setDate(d.getDate() - 1);
  }
  return streak;
}

async function loadMonthEntries(memberId, year, month0) {
  const prefix = `entry:${memberId}:${monthPrefix(year, month0)}`;
  try {
    const res = await appStorage.list(prefix, true);
    if (!res || !res.keys) return {};
    const out = {};
    await Promise.all(
      res.keys.map(async (k) => {
        try {
          const r = await appStorage.get(k, true);
          if (r) {
            const day = k.split(":").pop();
            out[day] = JSON.parse(r.value);
          }
        } catch {}
      })
    );
    return out;
  } catch { return {}; }
}

    <div className="flex items-center gap-1.5">
      <input
        type="number"
        min="0"
        inputMode="decimal"
        disabled={disabled}
        value={value ?? ""}

        placeholder="০"
        className="w-16 h-9 rounded-xl border px-2 text-right outline-none font-bold text-sm bg-slate-50 focus:bg-white transition-all"
        style={{ borderColor: "#D8DED3", fontFamily: "'IBM Plex Mono', monospace", color: "#16302B" }}
      />
      {target ? (
        <span className="text-xs font-semibold" style={{ color: "#8A9A8F", fontFamily: "'IBM Plex Mono', monospace" }}>
          /{toBn(target)}
        </span>
      ) : null}
    </div>
  );
}

function ProgressChart({ monthEntries, totalDays, member, allFields }) {
  const chartRef = useRef(null);
  const chartInstance = useRef(null);

  useEffect(() => {
    if (!chartRef.current) return;

    const labels = [];
    const scores = [];

    for (let d = 1; d <= totalDays; d++) {
      labels.push(toBn(d));
      const e = monthEntries[pad2(d)];
      const s = dailyScore(e, member, allFields);
      scores.push(s !== null ? Math.round(s * 100) : 0);
    }

    if (chartInstance.current) {
      chartInstance.current.destroy();
    }

    const ctx = chartRef.current.getContext("2d");
    chartInstance.current = new Chart(ctx, {
      type: "line",
      data: {
        labels: labels,
        datasets: [
          {
            label: "দৈনিক পারফরম্যান্স (%)",
            data: scores,
            borderColor: "#0E4B43",
            backgroundColor: "rgba(14, 75, 67, 0.1)",
            fill: true,
            tension: 0.3,
            pointRadius: 3,
            pointBackgroundColor: "#C89B3C",
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: { min: 0, max: 100, ticks: { stepSize: 25 } },
        },
        plugins: {
          legend: { display: false },
        },
      },
    });

    return () => {
      if (chartInstance.current) chartInstance.current.destroy();
    };
  }, [monthEntries, totalDays, member, allFields]);

  return (
    <div className="w-full h-40 mt-3">
      <canvas ref={chartRef}></canvas>
    </div>
  );
}

              rows={4}
              placeholder="আপনার অমূল্য পরামর্শ লিখুন..."
              className="w-full rounded-2xl border border-slate-200 p-3 text-xs outline-none focus:border-emerald-800 resize-none mb-3 bg-slate-50/50"
            />
            <div className="flex gap-2">
              <button onClick={handleSendFeedback} className="flex-1 h-9 bg-emerald-800 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-1.5"><MessageSquare size={14} /> পাঠিয়ে দিন</button>
              <button onClick={() => setShowFeedbackModal(false)} className="h-9 px-4 border border-slate-200 text-slate-600 rounded-xl text-xs font-bold">বাতিল</button>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

function FieldGroup({ title, fields, entry, onChange, member }) {
  return (
    <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80">
      <h3 className="text-sm font-bold mb-3 text-emerald-950">{title}</h3>
      <div className="space-y-3">
        {fields.filter(f => fieldApplies(f, member)).map((f) => (
          <div key={f.key} className="flex items-center justify-between gap-3">
            <span className="text-xs font-medium text-slate-700">{f.label}</span>
            {f.type === "bool" && <BoolToggle value={!!entry[f.key]} onChange={(v) => onChange(f.key, v)} />}
            {f.type === "count" && <CountStepper value={entry[f.key]} max={f.max} onChange={(v) => onChange(f.key, v)} />}
            {f.type === "number" && <NumberField value={entry[f.key]} target={f.target} onChange={(v) => onChange(f.key, v)} />}
          </div>
        ))}
      </div>
    </div>
  );
}

const container = document.getElementById("root");
const root = ReactDOM.createRoot(container);
root.render(<App />);
</script>
</body>
</html>
