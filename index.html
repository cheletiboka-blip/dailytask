  const firebaseConfig = {

    authDomain: "daily-task-family.firebaseapp.com",
    projectId: "daily-task-family",
    storageBucket: "daily-task-family.firebasestorage.app",
    messagingSenderId: "10031644603",
    appId: "1:10031644603:web:afaf01434c65147d988e9e"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  db.enablePersistence().catch(() => {});

  // Get or Set Family Code for Privacy
  function getFamilyCode() {
    let code = localStorage.getItem("family_code");
    if (!code) {
      code = "fam_" + Math.random().toString(36).substring(2, 8);
      localStorage.setItem("family_code", code);
    }
    return code;
  }

  function setFamilyCode(code) {
    localStorage.setItem("family_code", code.trim());
    window.location.reload();
  }

  const getCollectionName = () => `data_${getFamilyCode()}`;

  // Dynamic appStorage Shim
  const appStorage = {
    async get(key, shared) {
      if (!shared) {
        const v = localStorage.getItem(key);
        return v !== null ? { key, value: v, shared } : null;
      }
      const doc = await db.collection(getCollectionName()).doc(key).get();
      if (!doc.exists) return null;
      return { key, value: doc.data().value, shared };
    },
    async set(key, value, shared) {
      if (!shared) {
        localStorage.setItem(key, value);
        return { key, value, shared };
      }
      await db.collection(getCollectionName()).doc(key).set({ value, updatedAt: Date.now() });
      return { key, value, shared };
    },
    async delete(key, shared) {
      if (!shared) {
        localStorage.removeItem(key);
        return { key, deleted: true, shared };
      }
      await db.collection(getCollectionName()).doc(key).delete();
      return { key, deleted: true, shared };
    },
    async list(prefix, shared) {
      if (!shared) {
        const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
        return { keys, prefix, shared };
      }
      let q = db.collection(getCollectionName());
      if (prefix) {
        q = q
          .where(firebase.firestore.FieldPath.documentId(), ">=", prefix)
          .where(firebase.firestore.FieldPath.documentId(), "<", prefix + "\uf8ff");
      }
      const snap = await q.get();
      const keys = snap.docs.map((d) => d.id);
      return { keys, prefix, shared };
    }
  };

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>

const ALL_FIELDS = [...DEEN_FIELDS, ...DUNIYA_FIELDS];
const SCORED_FIELDS = ALL_FIELDS.filter((f) => !f.info);

function fieldApplies(field, member) {
  if (!field.appliesTo) return true;
  if (!member || !member.gender) return true;
  return field.appliesTo === member.gender;
}

const BN_DIGITS = "০১২৩৪৫৬৭৮৯";
const toBn = (n) => String(n).replace(/[0-9]/g, (d) => BN_DIGITS[d]);

const BN_MONTHS = [
  "জানুয়ারি", "ফেব্রুয়ারি", "মার্চ", "এপ্রিল", "মে", "জুন",
  "জুলাই", "আগস্ট", "সেপ্টেম্বর", "অক্টোবর", "নভেম্বর", "ডিসেম্বর",
];
const BN_WEEKDAYS = ["রবি", "সোম", "মঙ্গল", "বুধ", "বৃহ", "শুক্র", "শনি"];

function pad2(n) { return String(n).padStart(2, "0"); }
function dateKey(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function monthPrefix(year, month0) { return `${year}-${pad2(month0 + 1)}`; }
function daysInMonth(year, month0) { return new Date(year, month0 + 1, 0).getDate(); }

function dailyScore(entry, member) {
  if (!entry) return null;
  let sum = 0;
  let count = 0;
  for (const f of SCORED_FIELDS) {
    if (!fieldApplies(f, member)) continue;
    count += 1;
    if (f.type === "bool") {
      sum += entry[f.key] ? 1 : 0;
    } else if (f.type === "count") {
      sum += Math.min(f.max, Number(entry[f.key]) || 0) / f.max;
    } else if (f.type === "number") {
      if (f.target) {
        sum += Math.min(f.target, Number(entry[f.key]) || 0) / f.target;
      } else {
        sum += Number(entry[f.key]) > 0 ? 1 : 0;
      }
    }
  }
  return count ? sum / count : null;
}

function scoreColor(score) {
  if (score === null || score === undefined) return "#E7EEE3";
  if (score >= 0.85) return "#0E4B43";
  if (score >= 0.6) return "#4C8C74";
  if (score >= 0.35) return "#C89B3C";
  if (score > 0) return "#C1666B";
  return "#E7EEE3";
}

function fieldPercent(field, monthEntries, totalDays, member) {
  if (!fieldApplies(field, member)) return null;
  let hit = 0;
  let daysCounted = totalDays;
  if (field.type === "count") {
    let sum = 0;
    for (let d = 1; d <= totalDays; d++) {
      const e = monthEntries[pad2(d)];
      sum += Math.min(field.max, Number(e?.[field.key]) || 0);
    }
    return Math.round((sum / (totalDays * field.max)) * 100);
  }
  if (field.type === "number" && field.target) {
    let sum = 0;
    for (let d = 1; d <= totalDays; d++) {
      const e = monthEntries[pad2(d)];
      sum += Math.min(field.target, Number(e?.[field.key]) || 0);
    }
    return Math.round((sum / (totalDays * field.target)) * 100);
  }
  for (let d = 1; d <= totalDays; d++) {
    const e = monthEntries[pad2(d)];
    if (!e) continue;
    if (field.type === "bool" && e[field.key]) hit += 1;
    if (field.type === "number" && !field.target && Number(e[field.key]) > 0) hit += 1;
    if (field.type === "time" && e[field.key]) hit += 1;
  }
  return Math.round((hit / daysCounted) * 100);
}

function weeklyKey(memberId, year, month0) {
  return `weekly:${memberId}:${monthPrefix(year, month0)}`;
}
async function loadWeekly(memberId, year, month0) {
  try {
    const res = await appStorage.get(weeklyKey(memberId, year, month0), true);
    return res ? JSON.parse(res.value) : {};
  } catch { return {}; }
}
async function saveWeekly(memberId, year, month0, data) {
  await appStorage.set(weeklyKey(memberId, year, month0), JSON.stringify(data), true);
}
async function loadMembers() {
  try {
    const res = await appStorage.get("members", true);
    return res ? JSON.parse(res.value) : [];
  } catch { return []; }
}
async function saveMembers(members) {
  await appStorage.set("members", JSON.stringify(members), true);
}
async function loadEntry(memberId, key) {
  try {
    const res = await appStorage.get(`entry:${memberId}:${key}`, true);
    return res ? JSON.parse(res.value) : null;
  } catch { return null; }
}
async function saveEntry(memberId, key, data) {
  await appStorage.set(`entry:${memberId}:${key}`, JSON.stringify(data), true);
}
async function loadMonthEntries(memberId, year, month0) {
  const prefix = `entry:${memberId}:${monthPrefix(year, month0)}`;
  try {
    const res = await appStorage.list(prefix, true);
    if (!res || !res.keys) return {};
    const out = {};
    await Promise.all(
      res.keys.map(async (k) => {
        try {
          const r = await appStorage.get(k, true);
          if (r) {
            const day = k.split(":").pop();
            out[day] = JSON.parse(r.value);
          }
        } catch {}
      })
    );
    return out;
  } catch { return {}; }
}

    setLoadingEntry(true);

    });

      setLoadingWeekly(false);

    setWeekly((prev) => ({
      ...prev,
      [weekIdx]: { ...(prev[weekIdx] || {}), [field]: value },

    if (!selectedId) return;
    setSavingWeekly(true);
    await saveWeekly(selectedId, monthCursor.year, monthCursor.month0, weekly);
    setSavingWeekly(false);
    setWeeklySavedTick(true);
    setTimeout(() => setWeeklySavedTick(false), 1600);
  }

  async function handleAddMember() {
    const name = newName.trim();
    if (!name) return;
    const id = `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
    const next = [...(members || []), { id, name, gender: newGender }];
    setMembers(next);
    setSelectedId(id);
    setNewName("");
    setNewGender("male");
    setAddingMember(false);
    await saveMembers(next);
    try {
      await appStorage.set("last-selected-member", JSON.stringify(id), false);
    } catch {}
  }

  async function handleDeleteMember(id) {
    const next = (members || []).filter((m) => m.id !== id);
    setMembers(next);
    setConfirmDeleteId(null);
    await saveMembers(next);
    if (selectedId === id) {
      const fallback = next.length ? next[0].id : null;
      setSelectedId(fallback);
      try {
        if (fallback) {
          await appStorage.set("last-selected-member", JSON.stringify(fallback), false);
        } else {
          await appStorage.delete("last-selected-member", false);
        }
      } catch {}
    }
  }

  async function handleSelectMember(id) {
    setSelectedId(id);
    try {
      await appStorage.set("last-selected-member", JSON.stringify(id), false);
    } catch {}
  }

  function updateField(key, value) {
    setEntry((prev) => ({ ...prev, [key]: value }));
  }

  async function handleSave() {
    if (!selectedId) return;
    setSaving(true);
    await saveEntry(selectedId, dateKey(viewDate), entry);
    setSaving(false);
    setSavedTick(true);
    setTimeout(() => setSavedTick(false), 1600);
    refreshMonth();
  }

  function changeDay(delta) {
    const d = new Date(viewDate);
    d.setDate(d.getDate() + delta);
    setViewDate(d);
  }

  const isToday = dateKey(viewDate) === dateKey(new Date());

  const monthStats = useMemo(() => {
    const total = daysInMonth(monthCursor.year, monthCursor.month0);
    let filled = 0;
    let scoreSum = 0;
    for (let d = 1; d <= total; d++) {
      const e = monthEntries[pad2(d)];
      const s = dailyScore(e, selectedMember);
      if (s !== null) {
        filled += 1;
        scoreSum += s;
      }
    }
    const avg = filled ? scoreSum / filled : 0;
    return { total, filled, avgPct: Math.round(avg * 100) };
  }, [monthEntries, monthCursor, selectedMember]);

  if (members === null) {
    return (
      <div className="min-h-screen flex items-center justify-center" style={{ background: "#F4F7F1" }}>
        <Loader2 className="animate-spin" color="#0E4B43" size={28} />
      </div>
    );
  }

  if (members.length === 0) {
    return (
      <div className="min-h-screen flex items-center justify-center px-6" style={{ background: "#F4F7F1", fontFamily: "'Noto Sans Bengali', sans-serif" }}>
        <div className="w-full max-w-sm text-center">
          <div className="flex justify-center mb-3">
            <StarMark size={34} />
          </div>
          <h1 className="text-2xl font-bold mb-2" style={{ fontFamily: "'Noto Serif Bengali', serif", color: "#16302B" }}>
            Daily Task
          </h1>
          <p className="mb-6" style={{ color: "#4B5A50" }}>
            শুরু করতে পরিবারের প্রথম সদস্যের নাম দিন
          </p>
          <div className="flex flex-col gap-3 items-center">
            <div className="flex gap-2 w-full">
              <input
                value={newName}
                onChange={(e) => setNewName(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && handleAddMember()}
                placeholder="নাম লিখুন"
                className="flex-1 h-12 rounded-xl border px-4 outline-none"
                style={{ borderColor: "#D8DED3", background: "#fff" }}
                autoFocus
              />
            </div>
            <GenderToggle value={newGender} onChange={setNewGender} />
            <button onClick={handleAddMember} className="h-12 px-5 rounded-xl font-semibold text-white w-full" style={{ background: "#0E4B43" }}>
              যোগ করুন
            </button>
          </div>
        </div>
      </div>
    );
  }

  // Optimized Single-Page Print View (Multi-line Headers & Crisp Borders)
  if (printMode) {
    const total = monthStats.total;
    const rows = Array.from({ length: total }, (_, i) => i + 1);
    return (
      <div style={{ fontFamily: "'Noto Sans Bengali', sans-serif", color: "#111" }}>
        <style>{`
          @media print {
            @page { size: A4 landscape; margin: 5mm; }
            body { -webkit-print-color-adjust: exact; print-color-adjust: exact; background: #fff !important; }
            .no-print { display: none !important; }
          }
          table { border-collapse: collapse; width: 100%; table-layout: fixed; }
          th, td { border: 1px solid #444; padding: 2px 1px; font-size: 8px; text-align: center; vertical-align: middle; }
          th { 
            background: #0E4B43 !important; 
            color: #fff !important; 
            font-weight: 600; 
            font-size: 7.5px; 
            line-height: 1.1; 
            height: 38px;
            white-space: normal !important;
            word-break: break-word;
          }
          tr { height: 16px; }
          tbody tr:nth-child(even) { background-color: #f9fbf8; }
        `}</style>
        <div className="p-2 w-full mx-auto">
          <div className="flex items-center justify-between mb-2 no-print">
            <button onClick={() => setPrintMode(false)} className="px-3 py-1.5 rounded-lg border text-sm font-semibold" style={{ borderColor: "#D8DED3" }}>
              ← ফিরে যান
            </button>
            <button onClick={() => window.print()} className="px-4 py-1.5 rounded-lg text-sm font-semibold text-white flex items-center gap-2" style={{ background: "#0E4B43" }}>
              <Printer size={14} /> প্রিন্ট / PDF
            </button>
          </div>
          
          {/* PDF Header Section */}
          <div style={{ borderBottom: "2px solid #0E4B43", paddingBottom: "4px", marginBottom: "6px" }} className="flex justify-between items-end">
            <div>
              <h1 style={{ fontFamily: "'Noto Serif Bengali', serif", fontSize: 16, fontWeight: 700, margin: 0, color: "#0E4B43" }}>
                Daily Task — দ্বীন ও দুনিয়া ট্র্যাকার
              </h1>
              <p style={{ fontSize: 10, margin: "2px 0 0 0", color: "#444" }}>
                মাস: <b>{BN_MONTHS[monthCursor.month0]} {toBn(monthCursor.year)}</b> &nbsp;|&nbsp; সদস্য: <b>{selectedMember?.name}</b>
              </p>
            </div>
            <div style={{ fontSize: 10, textAlign: "right", color: "#333" }}>
              পূরণ করা দিন: <b>{toBn(monthStats.filled)}/{toBn(total)}</b> &nbsp;|&nbsp; গড় স্কোর: <b>{toBn(monthStats.avgPct)}%</b>
            </div>
          </div>

          <table>
            <thead>
              <tr>
                <th style={{ width: "22px" }}>তাং</th>
                {ALL_FIELDS.map((f) => (
                  <th key={f.key}>{f.shortLabel || f.label}</th>
                ))}
                <th style={{ width: "28px" }}>স্কোর</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((d) => {
                const e = monthEntries[pad2(d)];
                const s = dailyScore(e, selectedMember);
                return (
                  <tr key={d}>
                    <td style={{ fontWeight: 700, background: "#f0f4f1" }}>{toBn(d)}</td>
                    {ALL_FIELDS.map((f) => {
                      if (!fieldApplies(f, selectedMember)) return <td key={f.key} style={{ color: "#ccc" }}>—</td>;
                      if (!e) return <td key={f.key}></td>;
                      const v = e[f.key];
                      let disp = "";
                      if (f.type === "bool") disp = v ? "✓" : "";
                      else disp = v !== undefined && v !== "" ? toBn(v) : "";
                      return <td key={f.key} style={{ color: f.type === "bool" && v ? "#0E4B43" : "#111", fontWeight: f.type === "bool" && v ? "bold" : "normal" }}>{disp}</td>;
                    })}
                    <td style={{ fontWeight: 700, background: "#f0f4f1" }}>{s === null ? "" : toBn(Math.round(s * 100)) + "%"}</td>
                  </tr>
                );
              })}
            </tbody>
            <tfoot>
              <tr style={{ background: "#E7EEE3", fontWeight: 700 }}>
                <td>%</td>
                {ALL_FIELDS.map((f) => {
                  const pct = fieldPercent(f, monthEntries, total, selectedMember);
                  return <td key={f.key}>{pct === null ? "—" : toBn(pct) + "%"}</td>;
                })}
                <td>{toBn(monthStats.avgPct)}%</td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
    );
  }

  const total = monthStats.total;
  const firstOfMonth = new Date(monthCursor.year, monthCursor.month0, 1);
  const leadBlanks = firstOfMonth.getDay();

  return (
    <div className="min-h-screen pb-16" style={{ background: "#F4F7F1", fontFamily: "'Noto Sans Bengali', sans-serif" }}>
      {/* Header */}
      <div style={{ background: "#0E4B43" }} className="px-5 pt-6 pb-8 relative overflow-hidden">
        <div className="absolute -right-6 -top-6 opacity-10">
          <StarMark size={140} color="#F4F7F1" />
        </div>
        <div className="relative flex items-center justify-between mb-1">
          <div className="flex items-center gap-2">
            <StarMark size={20} />
            <h1 className="text-xl font-bold" style={{ fontFamily: "'Noto Serif Bengali', serif", color: "#F4F7F1" }}>
              Daily Task

          </div>
          {/* Privacy Code Settings */}
          <button
            onClick={() => setShowCodeModal(true)}
            className="flex items-center gap-1 text-xs px-2.5 py-1 rounded-full text-white/80 border border-white/20 hover:bg-white/10"

            <KeyIcon size={12} /> ফ্যামিলি কোড

        </div>
        <p className="relative text-sm" style={{ color: "#C7D6CD" }}>
          দ্বীন ও দুনিয়ার ব্যালেন্স ট্র্যাকার
        </p>

        {/* Member selector */}
        <div className="relative flex gap-2 mt-5 flex-wrap">
          {members.map((m) =>
            confirmDeleteId === m.id ? (
              <div key={m.id} className="px-2.5 py-1.5 rounded-full text-sm font-semibold flex items-center gap-1.5" style={{ background: "rgba(255,255,255,0.12)", color: "#F4F7F1" }}>
                <span>{m.name} মুছবেন?</span>
                <button onClick={() => handleDeleteMember(m.id)} className="w-6 h-6 rounded-full flex items-center justify-center" style={{ background: "#C1666B" }}>
                  <Check size={13} color="#fff" />
                </button>
                <button onClick={() => setConfirmDeleteId(null)} className="w-6 h-6 rounded-full flex items-center justify-center" style={{ background: "rgba(255,255,255,0.2)" }}>
                  <X size={13} color="#fff" />
                </button>
              </div>
            ) : (
              <button
                key={m.id}
                onClick={() => handleSelectMember(m.id)}
                className="pl-3 pr-1.5 py-1.5 rounded-full text-sm font-semibold flex items-center gap-1.5 transition-all"
                style={{
                  background: m.id === selectedId ? "#C89B3C" : "rgba(255,255,255,0.12)",
                  color: m.id === selectedId ? "#16302B" : "#F4F7F1",
                }}
              >
                <User size={13} /> {m.name}
                <span
                  onClick={(e) => {
                    e.stopPropagation();
                    setConfirmDeleteId(m.id);
                  }}
                  className="w-5 h-5 rounded-full flex items-center justify-center ml-0.5"
                  style={{ background: "rgba(0,0,0,0.12)" }}
                >
                  <X size={11} color={m.id === selectedId ? "#16302B" : "#F4F7F1"} />
                </span>
              </button>
            )
          )}
          {!addingMember ? (
            <button onClick={() => setAddingMember(true)} className="px-3 py-1.5 rounded-full text-sm font-semibold flex items-center gap-1" style={{ background: "rgba(255,255,255,0.12)", color: "#F4F7F1" }}>
              <Plus size={14} /> সদস্য
            </button>
          ) : (
            <div className="flex flex-col gap-1.5 p-2 rounded-2xl" style={{ background: "rgba(255,255,255,0.12)" }}>
              <div className="flex gap-1">
                <input
                  autoFocus
                  value={newName}
                  onChange={(e) => setNewName(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" && handleAddMember()}
                  placeholder="নাম"
                  className="w-24 px-2 rounded-full text-sm outline-none"
                  style={{ border: "none" }}
                />
                <button onClick={handleAddMember} className="px-3 rounded-full text-sm font-semibold" style={{ background: "#C89B3C", color: "#16302B" }}>
                  ঠিক আছে
                </button>
              </div>
              <GenderToggle value={newGender} onChange={setNewGender} light />
            </div>
          )}
        </div>
      </div>

      {/* Date nav */}
      <div className="px-5 -mt-4">
        <div className="bg-white rounded-2xl shadow-sm px-4 py-3 flex items-center justify-between" style={{ border: "1px solid #E7EEE3" }}>
          <button onClick={() => changeDay(-1)} className="w-9 h-9 flex items-center justify-center rounded-full" style={{ background: "#F4F7F1" }}>
            <ChevronLeft size={18} color="#0E4B43" />
          </button>
          <div className="text-center">
            <div className="font-semibold" style={{ color: "#16302B" }}>
              {isToday ? "আজ" : BN_WEEKDAYS[viewDate.getDay()]} · {toBn(viewDate.getDate())} {BN_MONTHS[viewDate.getMonth()]} {toBn(viewDate.getFullYear())}
            </div>
          </div>
          <button onClick={() => changeDay(1)} className="w-9 h-9 flex items-center justify-center rounded-full" style={{ background: "#F4F7F1" }}>
            <ChevronRight size={18} color="#0E4B43" />
          </button>
        </div>
      </div>

      {/* Entry form */}
      <div className="px-5 mt-5 space-y-4">
        {loadingEntry ? (
          <div className="flex justify-center py-10">
            <Loader2 className="animate-spin" color="#0E4B43" size={22} />
          </div>
        ) : (
          <>
            <FieldGroup title="দ্বীন" fields={DEEN_FIELDS} entry={entry} onChange={updateField} member={selectedMember} />
            <FieldGroup title="দুনিয়া" fields={DUNIYA_FIELDS} entry={entry} onChange={updateField} member={selectedMember} />

            <div className="bg-white rounded-2xl p-4" style={{ border: "1px solid #E7EEE3" }}>
              <label className="block text-sm font-semibold mb-2" style={{ color: "#16302B" }}>
                দিনের নোট / আত্ম-সমালোচনা
              </label>
              <textarea
                value={entry.note || ""}
                onChange={(e) => updateField("note", e.target.value)}
                rows={3}
                placeholder="আজকের অনুভূতি বা শিক্ষা লিখুন..."
                className="w-full rounded-xl border p-3 outline-none resize-none"
                style={{ borderColor: "#D8DED3" }}
              />
            </div>

            <button
              onClick={handleSave}
              disabled={saving}
              className="w-full h-12 rounded-xl font-bold text-white flex items-center justify-center gap-2"
              style={{ background: savedTick ? "#4C8C74" : "#0E4B43" }}
            >
              {saving ? <Loader2 className="animate-spin" size={18} /> : savedTick ? <Check size={18} /> : null}
              {savedTick ? "সেভ হয়েছে" : "সেভ করুন"}
            </button>
          </>
        )}
      </div>

      {/* Monthly overview */}
      <div className="px-5 mt-8">
        <div className="flex items-center justify-between mb-3">
          <h2 className="font-bold flex items-center gap-1.5" style={{ fontFamily: "'Noto Serif Bengali', serif", color: "#16302B" }}>
            <CalIcon size={16} /> মাসিক ওভারভিউ
          </h2>
          <div className="flex items-center gap-1">
            <button
              onClick={() => setMonthCursor((c) => (c.month0 === 0 ? { year: c.year - 1, month0: 11 } : { year: c.year, month0: c.month0 - 1 }))}
              className="w-7 h-7 flex items-center justify-center rounded-full bg-white"
              style={{ border: "1px solid #E7EEE3" }}
            >
              <ChevronLeft size={14} color="#0E4B43" />
            </button>
            <span className="text-sm font-semibold px-1" style={{ color: "#16302B" }}>
              {BN_MONTHS[monthCursor.month0]} {toBn(monthCursor.year)}
            </span>
            <button
              onClick={() => setMonthCursor((c) => (c.month0 === 11 ? { year: c.year + 1, month0: 0 } : { year: c.year, month0: c.month0 + 1 }))}
              className="w-7 h-7 flex items-center justify-center rounded-full bg-white"
              style={{ border: "1px solid #E7EEE3" }}
            >
              <ChevronRight size={14} color="#0E4B43" />
            </button>
          </div>
        </div>

        <div className="bg-white rounded-2xl p-4" style={{ border: "1px solid #E7EEE3" }}>
          <div className="flex items-center justify-between mb-4">
            <Stat label="গড় স্কোর" value={`${toBn(monthStats.avgPct)}%`} />
            <Stat label="পূরণ করা দিন" value={`${toBn(monthStats.filled)}/${toBn(total)}`} />
            <button
              onClick={() => setPrintMode(true)}
              className="flex items-center gap-1.5 px-3 py-2 rounded-xl text-sm font-semibold"
              style={{ background: "#F4F7F1", color: "#0E4B43", border: "1px solid #E7EEE3" }}
            >
              <Printer size={14} /> PDF
            </button>
          </div>

          {loadingMonth ? (
            <div className="flex justify-center py-6">
              <Loader2 className="animate-spin" color="#0E4B43" size={18} />
            </div>
          ) : (
            <>
              <div className="grid grid-cols-7 gap-1.5 mb-1">
                {BN_WEEKDAYS.map((w) => (
                  <div key={w} className="text-center text-[10px] font-semibold" style={{ color: "#8A9A8F" }}>
                    {w}
                  </div>
                ))}
              </div>
              <div className="grid grid-cols-7 gap-1.5">
                {Array.from({ length: leadBlanks }).map((_, i) => (
                  <div key={"b" + i} />
                ))}
                {Array.from({ length: total }, (_, i) => i + 1).map((d) => {
                  const e = monthEntries[pad2(d)];
                  const s = dailyScore(e, selectedMember);
                  const isSel = pad2(d) === pad2(viewDate.getDate()) && monthCursor.year === viewDate.getFullYear() && monthCursor.month0 === viewDate.getMonth();
                  return (
                    <button
                      key={d}
                      onClick={() => setViewDate(new Date(monthCursor.year, monthCursor.month0, d))}
                      className="aspect-square rounded-lg flex items-center justify-center text-[11px] font-semibold relative"
                      style={{
                        background: scoreColor(s),
                        color: s !== null && s >= 0.35 ? "#F4F7F1" : "#5A6A5F",
                        outline: isSel ? "2px solid #16302B" : "none",
                        outlineOffset: 1,
                      }}
                    >
                      {toBn(d)}
                    </button>
                  );
                })}
              </div>
            </>
          )}
        </div>
      </div>

      {/* Weekly reflection */}
      <div className="px-5 mt-8">
        <h2 className="font-bold mb-3" style={{ fontFamily: "'Noto Serif Bengali', serif", color: "#16302B" }}>
          সাপ্তাহিক রিফ্লেকশন
        </h2>
        <div className="space-y-3">
          {loadingWeekly ? (
            <div className="flex justify-center py-4">
              <Loader2 className="animate-spin" color="#0E4B43" size={18} />
            </div>
          ) : (
            [1, 2, 3, 4, 5].map((w) => (
              <div key={w} className="bg-white rounded-2xl p-4" style={{ border: "1px solid #E7EEE3" }}>
                <div className="text-sm font-bold mb-2" style={{ color: "#0E4B43" }}>
                  সপ্তাহ {toBn(w)}
                </div>
                <div className="space-y-2">
                  <textarea
                    value={weekly[w]?.good || ""}
                    onChange={(e) => updateWeekly(w, "good", e.target.value)}
                    placeholder="এই সপ্তাহে যা ভালো হয়েছে"
                    rows={2}
                    className="w-full rounded-lg border p-2 text-sm outline-none resize-none"
                    style={{ borderColor: "#D8DED3" }}
                  />
                  <textarea
                    value={weekly[w]?.gap || ""}
                    onChange={(e) => updateWeekly(w, "gap", e.target.value)}
                    placeholder="কোথায় ঘাটতি ছিল"
                    rows={2}
                    className="w-full rounded-lg border p-2 text-sm outline-none resize-none"
                    style={{ borderColor: "#D8DED3" }}
                  />
                  <textarea
                    value={weekly[w]?.plan || ""}
                    onChange={(e) => updateWeekly(w, "plan", e.target.value)}
                    placeholder="আগামী সপ্তাহে উন্নতির পরিকল্পনা"
                    rows={2}
                    className="w-full rounded-lg border p-2 text-sm outline-none resize-none"
                    style={{ borderColor: "#D8DED3" }}
                  />
                </div>
              </div>
            ))

          >

            {weeklySavedTick ? "সেভ হয়েছে" : "রিফ্লেকশন সেভ করুন"}

              আপনার বর্তমান কোড: <b className="text-emerald-800">{getFamilyCode()}</b><br/>
              অন্য যেকোনো ডিভাইসে এই কোড দিলে আপনার পরিবারের ডাটা দেখতে পারবেন।
            </p>
            <input
              value={inputCode}
              onChange={(e) => setInputCode(e.target.value)}
              placeholder="অন্য ফ্যামিলি কোড লিখুন"
              className="w-full h-10 border rounded-xl px-3 text-sm mb-3 outline-none"
            />
            <div className="flex gap-2">
              <button
                onClick={() => setFamilyCode(inputCode)}
                className="flex-1 h-10 rounded-xl text-white font-semibold text-sm"
                style={{ background: "#0E4B43" }}
              >
                কোড সেট করুন
              </button>
              <button
                onClick={() => setShowCodeModal(false)}
                className="px-4 h-10 rounded-xl border text-sm font-semibold"
              >
                বন্ধ
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function GenderToggle({ value, onChange, light }) {
  const base = light
    ? { off: "rgba(255,255,255,0.12)", offText: "#F4F7F1", on: "#C89B3C", onText: "#16302B" }
    : { off: "#F4F7F1", offText: "#4B5A50", on: "#0E4B43", onText: "#fff" };
  return (
    <div className="flex rounded-xl overflow-hidden" style={{ border: `1px solid ${light ? "rgba(255,255,255,0.2)" : "#D8DED3"}` }}>
      {[
        { key: "male", label: "পুরুষ" },
        { key: "female", label: "মহিলা" },
      ].map((g) => (
        <button
          key={g.key}
          type="button"
          onClick={() => onChange(g.key)}
          className="px-3 h-9 text-sm font-semibold"
          style={{
            background: value === g.key ? base.on : base.off,
            color: value === g.key ? base.onText : base.offText,
          }}
        >
          {g.label}
        </button>
      ))}
    </div>
  );
}

function Stat({ label, value }) {
  return (
    <div>
      <div className="text-[11px]" style={{ color: "#8A9A8F" }}>
        {label}
      </div>
      <div className="text-lg font-bold" style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#16302B" }}>
        {value}
      </div>
    </div>
  );
}

function FieldGroup({ title, fields, entry, onChange, member }) {
  const visibleFields = fields.filter((f) => fieldApplies(f, member));
  if (!visibleFields.length) return null;
  return (
    <div className="bg-white rounded-2xl p-4" style={{ border: "1px solid #E7EEE3" }}>
      <h3 className="text-sm font-bold mb-3 tracking-wide" style={{ fontFamily: "'Noto Serif Bengali', serif", color: "#0E4B43" }}>
        {title}
      </h3>
      <div className="space-y-3">
        {visibleFields.map((f) => (
          <div key={f.key} className="flex items-center justify-between gap-3">
            <span className="text-sm" style={{ color: "#33443A" }}>
              {f.label}
            </span>
            {f.type === "bool" && (
              <BoolToggle value={!!entry[f.key]} onChange={(v) => onChange(f.key, v)} />
            )}
            {f.type === "count" && (
              <CountStepper value={entry[f.key]} max={f.max} onChange={(v) => onChange(f.key, v)} />
            )}
            {f.type === "number" && (
              <NumberField value={entry[f.key]} target={f.target} onChange={(v) => onChange(f.key, v)} />
            )}
            {f.type === "time" && (
              <TimeField value={entry[f.key]} onChange={(v) => onChange(f.key, v)} />
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

const container = document.getElementById("root");
const root = ReactDOM.createRoot(container);
root.render(<App />);
</script>
</body>
</html>
