    messagingSenderId: "10031644603",
    appId: "1:10031644603:web:afaf01434c65147d988e9e"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  db.enablePersistence().catch(() => {});

  function getFamilyCode() {
    let code = localStorage.getItem("family_code");
    if (!code) {
      code = "fam_" + Math.random().toString(36).substring(2, 8);
      localStorage.setItem("family_code", code);
    }
    return code;
  }

  function setFamilyCode(code) {
    localStorage.setItem("family_code", code.trim());
    window.location.reload();
  }

  const getCollectionName = () => `data_${getFamilyCode()}`;

  const appStorage = {
    async get(key, shared) {
      if (!shared) {
        const v = localStorage.getItem(key);
        return v !== null ? { key, value: v, shared } : null;
      }
      const doc = await db.collection(getCollectionName()).doc(key).get();
      if (!doc.exists) return null;
      return { key, value: doc.data().value, shared };
    },
    async set(key, value, shared) {
      if (!shared) {
        localStorage.setItem(key, value);
        return { key, value, shared };
      }
      await db.collection(getCollectionName()).doc(key).set({ value, updatedAt: Date.now() });
      return { key, value, shared };
    },
    async delete(key, shared) {
      if (!shared) {
        localStorage.removeItem(key);
        return { key, deleted: true, shared };
      }
      await db.collection(getCollectionName()).doc(key).delete();
      return { key, deleted: true, shared };
    },
    async list(prefix, shared) {
      if (!shared) {
        const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
        return { keys, prefix, shared };
      }
      let q = db.collection(getCollectionName());
      if (prefix) {
        q = q
          .where(firebase.firestore.FieldPath.documentId(), ">=", prefix)
          .where(firebase.firestore.FieldPath.documentId(), "<", prefix + "\uf8ff");
      }
      const snap = await q.get();
      const keys = snap.docs.map((d) => d.id);
      return { keys, prefix, shared };
    }
  };

  // PWA Service Worker Registration
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>

function fieldApplies(field, member) {
  if (!field.appliesTo) return true;
  if (!member || !member.gender) return true;
  return field.appliesTo === member.gender;
}

const BN_DIGITS = "০১২৩৪৫৬৭৮৯";
const toBn = (n) => String(n).replace(/[0-9]/g, (d) => BN_DIGITS[d]);

const BN_MONTHS = [
  "জানুয়ারি", "ফেব্রুয়ারি", "মার্চ", "এপ্রিল", "মে", "জুন",
  "জুলাই", "আগস্ট", "সেপ্টেম্বর", "অক্টোবর", "নভেম্বর", "ডিসেম্বর",
];
const BN_WEEKDAYS = ["রবি", "সোম", "মঙ্গল", "বুধ", "বৃহ", "শুক্র", "শনি"];

function pad2(n) { return String(n).padStart(2, "0"); }
function dateKey(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function monthPrefix(year, month0) { return `${year}-${pad2(month0 + 1)}`; }
function daysInMonth(year, month0) { return new Date(year, month0 + 1, 0).getDate(); }

function dailyScore(entry, member, allFields) {
  if (!entry) return null;
  let sum = 0;
  let count = 0;
  for (const f of allFields) {
    if (!fieldApplies(f, member)) continue;
    count += 1;
    if (f.type === "bool") {
      sum += entry[f.key] ? 1 : 0;
    } else if (f.type === "count") {
      sum += Math.min(f.max, Number(entry[f.key]) || 0) / f.max;
    } else if (f.type === "number") {
      if (f.target) {
        sum += Math.min(f.target, Number(entry[f.key]) || 0) / f.target;
      } else {
        sum += Number(entry[f.key]) > 0 ? 1 : 0;
      }
    }
  }
  return count ? sum / count : null;
}

function scoreColor(score) {
  if (score === null || score === undefined) return "#E7EEE3";
  if (score >= 0.85) return "#0E4B43";
  if (score >= 0.6) return "#4C8C74";
  if (score >= 0.35) return "#C89B3C";
  if (score > 0) return "#C1666B";
  return "#E7EEE3";
}

function calculateStreak(monthEntries, member) {
  let streak = 0;
  const today = new Date();
  const d = new Date(today);

  for (let i = 0; i < 365; i++) {
    const dayStr = pad2(d.getDate());
    const entry = monthEntries[dayStr];
    
    // Check if score is above 50% for positive streak
    if (entry && dailyScore(entry, member, [...DEFAULT_DEEN_FIELDS, ...DEFAULT_DUNIYA_FIELDS]) >= 0.5) {
      streak++;
    } else if (i > 0) {
      break; 
    }
    d.setDate(d.getDate() - 1);
  }
  return streak;
}

async function loadCustomFields() {

async function loadEntry(memberId, key) {
  try {
    const res = await appStorage.get(`entry:${memberId}:${key}`, true);
    return res ? JSON.parse(res.value) : null;
  } catch { return null; }
}
async function saveEntry(memberId, key, data) {
  await appStorage.set(`entry:${memberId}:${key}`, JSON.stringify(data), true);
}
async function loadMonthEntries(memberId, year, month0) {
  const prefix = `entry:${memberId}:${monthPrefix(year, month0)}`;
  try {
    const res = await appStorage.list(prefix, true);
    if (!res || !res.keys) return {};
    const out = {};
    await Promise.all(
      res.keys.map(async (k) => {
        try {
          const r = await appStorage.get(k, true);
          if (r) {
            const day = k.split(":").pop();
            out[day] = JSON.parse(r.value);
          }
        } catch {}
      })
    );
    return out;
  } catch { return {}; }
}

function CountStepper({ value, onChange, max, disabled }) {
  const v = Number(value) || 0;
  return (
    <div className="flex items-center gap-2">
      <button
        type="button"
        disabled={disabled}
        onClick={() => onChange(Math.max(0, v - 1))}
        className="w-8 h-8 rounded-lg border flex items-center justify-center text-lg"
        style={{ borderColor: "#D8DED3", color: "#16302B" }}
      >
        −
      </button>
      <span className="w-8 text-center font-semibold" style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#16302B" }}>
        {toBn(v)}
      </span>
      <button
        type="button"
        disabled={disabled}
        onClick={() => onChange(Math.min(max, v + 1))}
        className="w-8 h-8 rounded-lg border flex items-center justify-center text-lg"
        style={{ borderColor: "#D8DED3", color: "#16302B" }}
      >
        +
      </button>
    </div>
  );
}

function ProgressChart({ monthEntries, totalDays, member, allFields }) {
  const chartRef = useRef(null);
  const chartInstance = useRef(null);

  useEffect(() => {
    if (!chartRef.current) return;

    const labels = [];
    const scores = [];

    for (let d = 1; d <= totalDays; d++) {
      labels.push(toBn(d));
      const e = monthEntries[pad2(d)];
      const s = dailyScore(e, member, allFields);
      scores.push(s !== null ? Math.round(s * 100) : 0);
    }

    if (chartInstance.current) {
      chartInstance.current.destroy();
    }

    const ctx = chartRef.current.getContext("2d");
    chartInstance.current = new Chart(ctx, {
      type: "line",
      data: {
        labels: labels,
        datasets: [
          {
            label: "দৈনিক পারফরম্যান্স (%)",
            data: scores,
            borderColor: "#0E4B43",
            backgroundColor: "rgba(14, 75, 67, 0.1)",
            fill: true,
            tension: 0.3,
            pointRadius: 3,
            pointBackgroundColor: "#C89B3C",
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: { min: 0, max: 100, ticks: { stepSize: 25 } },
        },
        plugins: {
          legend: { display: false },
        },
      },
    });

    return () => {
      if (chartInstance.current) chartInstance.current.destroy();
    };
  }, [monthEntries, totalDays, member, allFields]);

  return (
    <div className="w-full h-40 mt-3">
      <canvas ref={chartRef}></canvas>
    </div>
  );
}

    setNewGender("male");
    setAddingMember(false);
    await saveMembers(next);
  }

  function updateField(key, value) {
    setEntry((prev) => ({ ...prev, [key]: value }));
  }

  async function handleSave() {
    if (!selectedId) return;
    setSaving(true);
    await saveEntry(selectedId, dateKey(viewDate), entry);
    setSaving(false);
    setSavedTick(true);
    setTimeout(() => setSavedTick(false), 1600);
    refreshMonth();
  }

  const streak = useMemo(() => calculateStreak(monthEntries, selectedMember), [monthEntries, selectedMember]);

  const monthStats = useMemo(() => {
    const total = daysInMonth(monthCursor.year, monthCursor.month0);
    let filled = 0;
    let scoreSum = 0;
    for (let d = 1; d <= total; d++) {
      const e = monthEntries[pad2(d)];
      const s = dailyScore(e, selectedMember, allFields);
      if (s !== null) {
        filled += 1;
        scoreSum += s;
      }
    }
    const avg = filled ? scoreSum / filled : 0;
    return { total, filled, avgPct: Math.round(avg * 100) };
  }, [monthEntries, monthCursor, selectedMember, allFields]);

  if (members === null) return <div className="min-h-screen flex items-center justify-center"><Loader2 className="animate-spin" color="#0E4B43" size={28} /></div>;

  return (
    <div className="min-h-screen pb-16" style={{ background: "#F4F7F1", fontFamily: "'Noto Sans Bengali', sans-serif" }}>
      {/* Header */}
      <div style={{ background: "#0E4B43" }} className="px-5 pt-6 pb-8 relative overflow-hidden">
        <div className="relative flex items-center justify-between mb-1">
          <div className="flex items-center gap-2">
            <StarMark size={20} />
            <h1 className="text-xl font-bold" style={{ fontFamily: "'Noto Serif Bengali', serif", color: "#F4F7F1" }}>
              Daily Task
            </h1>
          </div>
          
          <button onClick={() => setShowCodeModal(true)} className="flex items-center gap-1 text-xs px-2.5 py-1 rounded-full text-white/80 border border-white/20">
            <KeyIcon size={12} /> ফ্যামিলি কোড
          </button>
        </div>

        {/* Streak Counter */}
        <div className="mt-3 flex items-center gap-2 bg-white/10 px-3 py-1.5 rounded-xl w-fit">
          <span className="text-lg">🔥</span>
          <span className="text-xs font-semibold text-white">ধারাবাহিক স্ট্রিক: {toBn(streak)} দিন</span>
        </div>

        {/* Member Selector */}
        <div className="relative flex gap-2 mt-4 flex-wrap">
          {members.map((m) => (
            <button
              key={m.id}
              onClick={() => setSelectedId(m.id)}
              className="px-3 py-1.5 rounded-full text-sm font-semibold flex items-center gap-1"
              style={{ background: m.id === selectedId ? "#C89B3C" : "rgba(255,255,255,0.12)", color: m.id === selectedId ? "#16302B" : "#F4F7F1" }}
            >
              <User size={13} /> {m.name}
            </button>
          ))}
        </div>
      </div>

      {/* Date Nav */}
      <div className="px-5 -mt-4">
        <div className="bg-white rounded-2xl shadow-sm px-4 py-3 flex items-center justify-between" style={{ border: "1px solid #E7EEE3" }}>
          <button onClick={() => setViewDate(new Date(viewDate.setDate(viewDate.getDate() - 1)))} className="w-8 h-8 flex items-center justify-center rounded-full bg-slate-100">
            <ChevronLeft size={16} />
          </button>
          <div className="font-semibold text-sm" style={{ color: "#16302B" }}>
            {toBn(viewDate.getDate())} {BN_MONTHS[viewDate.getMonth()]} {toBn(viewDate.getFullYear())}
          </div>
          <button onClick={() => setViewDate(new Date(viewDate.setDate(viewDate.getDate() + 1)))} className="w-8 h-8 flex items-center justify-center rounded-full bg-slate-100">
            <ChevronRight size={16} />
          </button>
        </div>
      </div>

      {/* Entry Forms */}
      <div className="px-5 mt-5 space-y-4">
        <FieldGroup title="দ্বীন" fields={DEFAULT_DEEN_FIELDS} entry={entry} onChange={updateField} member={selectedMember} />
        <FieldGroup title="দুনিয়া" fields={DEFAULT_DUNIYA_FIELDS} entry={entry} onChange={updateField} member={selectedMember} />
        
        {/* Custom Tasks Section */}
        <div className="bg-white rounded-2xl p-4" style={{ border: "1px solid #E7EEE3" }}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{ color: "#0E4B43" }}>কাস্টম টাস্ক (ব্যক্তিগত લક્ષ্য)</h3>
            <button onClick={() => setShowAddCustom(true)} className="text-xs font-semibold text-emerald-800 flex items-center gap-1">
              <Plus size={12} /> নতুন যোগ করুন
            </button>
          </div>
          {customFields.map((f) => (
            <div key={f.key} className="flex items-center justify-between gap-3 py-1.5">
              <span className="text-sm">{f.label}</span>
              <BoolToggle value={!!entry[f.key]} onChange={(v) => updateField(f.key, v)} />
            </div>
          ))}
        </div>

        <button onClick={handleSave} className="w-full h-12 rounded-xl font-bold text-white flex items-center justify-center gap-2" style={{ background: "#0E4B43" }}>
          {savedTick ? "সেভ হয়েছে!" : "সেভ করুন"}
        </button>
      </div>

      {/* Visual Chart */}
      <div className="px-5 mt-8">
        <div className="bg-white rounded-2xl p-4" style={{ border: "1px solid #E7EEE3" }}>
          <h2 className="font-bold text-sm mb-2" style={{ color: "#16302B" }}>মাসিক অগ্রগতি গ্রাফ</h2>
          <ProgressChart monthEntries={monthEntries} totalDays={monthStats.total} member={selectedMember} allFields={allFields} />
        </div>
      </div>

      {/* Add Custom Field Modal */}
      {showAddCustom && (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center px-5 z-50">
          <div className="bg-white rounded-2xl p-5 w-full max-w-sm">
            <h3 className="font-bold text-md mb-2">নতুন কাস্টম টাস্ক নাম লিখুন</h3>
            <input
              value={newCustomLabel}
              onChange={(e) => setNewCustomLabel(e.target.value)}
              placeholder="যেমন: ২ লিটার পানি পান"
              className="w-full h-10 border rounded-xl px-3 text-sm mb-4 outline-none"
            />
            <div className="flex gap-2">
              <button onClick={handleAddCustomField} className="flex-1 h-9 bg-emerald-800 text-white rounded-xl text-xs font-semibold">যোগ করুন</button>
              <button onClick={() => setShowAddCustom(false)} className="flex-1 h-9 border rounded-xl text-xs font-semibold">বাতিল</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function FieldGroup({ title, fields, entry, onChange, member }) {
  return (
    <div className="bg-white rounded-2xl p-4" style={{ border: "1px solid #E7EEE3" }}>
      <h3 className="text-sm font-bold mb-3" style={{ color: "#0E4B43" }}>{title}</h3>
      <div className="space-y-3">
        {fields.filter(f => fieldApplies(f, member)).map((f) => (
          <div key={f.key} className="flex items-center justify-between gap-3">
            <span className="text-sm" style={{ color: "#33443A" }}>{f.label}</span>
            {f.type === "bool" && <BoolToggle value={!!entry[f.key]} onChange={(v) => onChange(f.key, v)} />}
            {f.type === "count" && <CountStepper value={entry[f.key]} max={f.max} onChange={(v) => onChange(f.key, v)} />}
          </div>
        ))}
      </div>
    </div>
  );
}

const container = document.getElementById("root");
const root = ReactDOM.createRoot(container);
root.render(<App />);
</script>
</body>
</html>
